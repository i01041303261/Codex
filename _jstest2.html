    const jobAtk = Math.round(job.atk * mult);
    const jobDef = Math.round(job.def * mult);
    const jobHp = Math.round(job.hp * mult);
    const jobMp = Math.round(job.mp * mult);

    const baseAtk = 10 + (state.level * 2) + (state.forgeAtk || 0) + jobAtk;
    const baseDef = 3 + Math.floor(state.level * 0.8) + (state.forgeDef || 0) + jobDef;
    const maxHp = 100 + (state.level * 15) + (state.forgeHp || 0) + jobHp;
    const maxMp = 50 + (state.level * 3) + jobMp;
    return { atk: baseAtk, def: baseDef, maxHp, maxMp, jobAtk, jobDef, jobHp, jobMp, mult };
  }

  function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[ch]));
  }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function dailyCheck() {
    const today = todayStr();
    if (state.lastRouletteRefill !== today) {
      state.roulette.tries = 10;
      state.dailyDone = false;
      state.questProgress = { explore: 0, battle: 0, mini: 0 };
      state.lastRouletteRefill = today;
      save();
    }
  }
  dailyCheck();
  setInterval(dailyCheck, 60 * 1000);

  // ----------------------------------------------------
  // 실시간 이벤트 시스템 (EXP 2배 / 무한 룰렛 / 행운 100%)
  // ----------------------------------------------------
  function isExp2EventActive() {
    return localStorage.getItem("codex_event_exp2") === "true";
  }

  function isInfRouletteEventActive() {
    return localStorage.getItem("codex_event_inf_roulette") === "true";
  }

  function isLuckEventActive() {
    return localStorage.getItem("codex_event_luck100") === "true";
  }

  function updateEventBanner() {
    const banner = document.getElementById("codexEventBanner");
    const bannerText = document.getElementById("codexEventBannerText");
    if (!banner || !bannerText) return;

    const exp2 = isExp2EventActive();
    const infR = isInfRouletteEventActive();
    const luck = isLuckEventActive();

    if (exp2 || infR || luck) {
      banner.style.display = "flex";
      const tags = [];
      if (exp2) tags.push("⚡ [경험치 2배 버닝 중]");
      if (infR) tags.push("🎰 [무한 룰렛 페스티벌 중]");
      if (luck) tags.push("🍀 [행운 100% 증가: 실패 없음/대성공 UP]");
      bannerText.innerHTML = `<span style="color:var(--gold); font-weight:800;">🔥 SPECIAL EVENT ACTIVE:</span> ${tags.join(" · ")}`;
    } else {
      banner.style.display = "none";
    }
  }

  // 7. 보상 및 성장
  function gainReward(expGain, tokenGain, triggerMsg) {
    if (state.level >= MAX_LEVEL) {
      state.level = MAX_LEVEL;
      state.exp = 0;
      state.tokens += tokenGain;
      Sound.win();
      if (triggerMsg) state.lastEvent = triggerMsg;
      save();
      updateUI();
      return;
    }

    if (isExp2EventActive() && expGain > 0) {
      expGain = expGain * 2;
      triggerMsg = (triggerMsg ? triggerMsg + " " : "") + "🔥(EXP 2배 이벤트!)";
    }
    state.exp += expGain;
    state.tokens += tokenGain;
    Sound.win();

    let leveledUp = false;
    let oldLv = state.level;
    while (state.level < MAX_LEVEL && state.exp >= nextLevelExp()) {
      state.exp -= nextLevelExp();
      state.level++;
      leveledUp = true;
    }

    if (state.level >= MAX_LEVEL) {
      state.level = MAX_LEVEL;
      state.exp = 0;
    }

    if (leveledUp) {
      Sound.levelUp();
      if (state.level >= MAX_LEVEL) {
        showResultModal(true, `👑 [최고 레벨 만렙 달성!]\n축하합니다! 끝없는 차원의 모험 최고 레벨인 Lv.${MAX_LEVEL} 만렙에 등극하셨습니다! 🎉✨\n(모든 차원과 시공간을 초월한 절대자의 스탯을 획득했습니다!)`);
      } else {
        showResultModal(true, `🎉 LEVEL UP!\nLv.${oldLv} ➡️ Lv.${state.level} 달성!\n(스탯과 체력이 대폭 상승했습니다! / 최고 만렙: Lv.${MAX_LEVEL})`);
      }
    } else if (triggerMsg) {
      state.lastEvent = triggerMsg;
    }
    save();
  }

  // 8. UI 동기화
  let currentHp = null;
  let currentMp = null;

  function updateUI() {
    if (state.level > MAX_LEVEL) state.level = MAX_LEVEL;
    const isMaxLv = state.level >= MAX_LEVEL;
    if (isMaxLv) state.exp = 0;

    const stats = getPlayerStats();
    if (currentHp === null || currentHp > stats.maxHp) currentHp = stats.maxHp;
    if (currentMp === null || currentMp > stats.maxMp) currentMp = stats.maxMp;

    const tokensEl = document.getElementById("tokens");
    const levelEl = document.getElementById("level");
    if (tokensEl) tokensEl.textContent = state.tokens.toLocaleString();
    if (levelEl) levelEl.textContent = isMaxLv ? `${MAX_LEVEL} (만렙)` : state.level;

    const hpPercent = Math.max(0, Math.min(100, (currentHp / stats.maxHp) * 100));
    const mpPercent = Math.max(0, Math.min(100, (currentMp / stats.maxMp) * 100));
    const expPercent = isMaxLv ? 100 : Math.max(0, Math.min(100, (state.exp / nextLevelExp()) * 100));

    const hudHpBar = document.getElementById("hudHpBar");
    const hudHpVal = document.getElementById("hudHpVal");
    if (hudHpBar) hudHpBar.style.width = hpPercent + "%";
    if (hudHpVal) hudHpVal.textContent = Math.round(currentHp) + "/" + stats.maxHp;

    const hudMpBar = document.getElementById("hudMpBar");
    const hudMpVal = document.getElementById("hudMpVal");
    if (hudMpBar) hudMpBar.style.width = mpPercent + "%";
    if (hudMpVal) hudMpVal.textContent = Math.round(currentMp) + "/" + stats.maxMp;

    const hudExpBar = document.getElementById("hudExpBar");
    const hudExpVal = document.getElementById("hudExpVal");
    if (hudExpBar) hudExpBar.style.width = expPercent + "%";
    if (hudExpVal) hudExpVal.textContent = isMaxLv ? "MAX (만렙)" : state.exp + "/" + nextLevelExp();

    const job = getCurrentJob();
    const upg = getJobUpgrade(job.id);
    const hudJobBadge = document.getElementById("hudJobBadge");
    if (hudJobBadge) {
      if (upg.awakened) {
        hudJobBadge.innerHTML = `<span class="awakened-sparkle">🌌</span> [초월] ${job.name}`;
        hudJobBadge.classList.add("job-awakened-glow");
      } else if (upg.rank > 0) {
        hudJobBadge.textContent = `${job.icon} ${job.name} (★${upg.rank}차)`;
        hudJobBadge.classList.remove("job-awakened-glow");
      } else {
        hudJobBadge.textContent = `${job.icon} ${job.name}`;
        hudJobBadge.classList.remove("job-awakened-glow");
      }
    }

    const hudTitleBadge = document.getElementById("hudTitleBadge");
    if (hudTitleBadge) hudTitleBadge.textContent = state.equippedTitle || "🌱 새싹 탐험가";

    const playerAvatar = document.getElementById("playerAvatar");
    if (playerAvatar) playerAvatar.textContent = state.avatar || "🧙";

    const hudPlayerName = document.getElementById("hudPlayerName");
    const user = getCurrentUser();
    if (hudPlayerName) {
      hudPlayerName.textContent = user ? `${user.nickname} (@${user.username})` : "게스트 탐험가";
    }

    const record = document.getElementById("record");
    const homeAtk = document.getElementById("homeAtk");
    const homeDef = document.getElementById("homeDef");
    const homeJobText = document.getElementById("homeJobText");
    if (record) record.textContent = state.lastEvent || "모험을 시작해보세요.";

    updateEventBanner();
    if (homeAtk) homeAtk.textContent = stats.atk;
    if (homeDef) homeDef.textContent = stats.def;
    if (homeJobText) {
      if (upg.awakened) {
        homeJobText.innerHTML = `<span style="color:#00f5d4; font-weight:900;">🌌 [초월각성] ${job.icon} ${job.name} (${job.tier})</span> <span style="font-size:0.82rem; color:var(--gold);">[스탯 400% 폭증]</span>`;
      } else if (upg.rank > 0) {
        const bonusPct = Math.round((JOB_PROMOTIONS[upg.rank].bonusMult - 1) * 100);
        homeJobText.innerHTML = `${job.icon} ${job.name} (${job.tier}) <span style="color:var(--gold); font-weight:800;">[★${upg.rank}차 승급 +${bonusPct}%]</span>`;
      } else {
        homeJobText.textContent = `${job.icon} ${job.name} (${job.tier})`;
      }
    }

    // 퀘스트
    const q1 = document.getElementById("qCheck1");
    const q2 = document.getElementById("qCheck2");
    const q3 = document.getElementById("qCheck3");
    if (q1) { const ok = state.questProgress.explore >= 1; q1.textContent = ok ? "✅" : "⬜"; q1.className = "quest-check " + (ok ? "done" : ""); }
    if (q2) { const ok = state.questProgress.battle >= 1; q2.textContent = ok ? "✅" : "⬜"; q2.className = "quest-check " + (ok ? "done" : ""); }
    if (q3) { const ok = state.questProgress.mini >= 1; q3.textContent = ok ? "✅" : "⬜"; q3.className = "quest-check " + (ok ? "done" : ""); }

    renderDimensionCards();
    renderStoryChapters();
    renderJobAltar();
    renderJobsGrid();
    renderTitlesBook();
  }

  // 9. 직업 50개 룰렛 및 선택
  window.spinRandomJob = function() {
    const infRoulette = isInfRouletteEventActive();
    if (!infRoulette && state.tokens < 100) {
      Sound.hit();
      alert("❌ 토큰이 부족합니다! 직업 각성에는 🪙 100 토큰이 필요합니다.");
      return;
    }
    if (!infRoulette) {
      state.tokens -= 100;
    }
    Sound.click();

    const btn = document.getElementById("spinJobBtn");
    const iconEl = document.getElementById("jobDisplayIcon");
    const nameEl = document.getElementById("jobDisplayName");
    const badgeEl = document.getElementById("jobTierBadge");
    const statsEl = document.getElementById("jobDisplayStats");
    const descEl = document.getElementById("jobDisplayDesc");

    if (btn) btn.disabled = true;
    if (iconEl) iconEl.classList.add("spinning");

    let count = 0;
    const timer = setInterval(() => {
      Sound.click();
      const tempJob = JOBS[rand(0, JOBS.length - 1)];
      if (iconEl) iconEl.textContent = tempJob.icon;
      if (nameEl) nameEl.textContent = tempJob.name;
      count++;

      if (count >= 16) {
        clearInterval(timer);
        if (iconEl) iconEl.classList.remove("spinning");
        if (btn) btn.disabled = false;

        // 최종 직업 결정
        let pool = JOBS;
        if (isLuckEventActive()) {
          const highTierPool = JOBS.filter(j => ["레어", "에픽", "슈퍼에픽", "전설", "신화"].includes(j.tier));
          if (highTierPool.length) pool = highTierPool;
        }
        const finalJob = pool[rand(0, pool.length - 1)];
        state.jobId = finalJob.id;
        if (!state.unlockedJobs) state.unlockedJobs = [1];
        if (!state.unlockedJobs.includes(finalJob.id)) {
          state.unlockedJobs.push(finalJob.id);
        }
        previewJobId = finalJob.id;
        Sound.levelUp();

        const finalUpg = getJobUpgrade(finalJob.id);
        let finalMult = 1.0;
        if (finalUpg.awakened) finalMult = AWAKENING_REQ.bonusMult;
        else if (finalUpg.rank > 0 && JOB_PROMOTIONS[finalUpg.rank]) finalMult = JOB_PROMOTIONS[finalUpg.rank].bonusMult;

        const finalAtk = Math.round(finalJob.atk * finalMult);
        const finalDef = Math.round(finalJob.def * finalMult);
        const finalHp = Math.round(finalJob.hp * finalMult);
        const finalMp = Math.round(finalJob.mp * finalMult);

        if (iconEl) iconEl.textContent = finalJob.icon;
        if (nameEl) {
          if (finalUpg.awakened) nameEl.innerHTML = `🌌 [초월각성] ${escapeHtml(finalJob.name)}`;
          else if (finalUpg.rank > 0) nameEl.innerHTML = `${escapeHtml(finalJob.name)} <small style="color:var(--gold);">(★${finalUpg.rank}차)</small>`;
          else nameEl.textContent = finalJob.name;
        }
        if (badgeEl) {
          badgeEl.textContent = finalJob.tier;
          badgeEl.className = "tier-tag tier-" + finalJob.tier;
        }
        if (descEl) descEl.textContent = finalJob.desc;
        if (statsEl) {
          statsEl.innerHTML = `⚔️ 공격력 +${finalAtk} · 🛡️ 방어력 +${finalDef} · ❤️ HP +${finalHp} · 💧 MP +${finalMp}`;
        }

        const equipBtn = document.getElementById("equipJobBtn");
        if (equipBtn) {
          equipBtn.textContent = "✅ 현재 장착 중";
          equipBtn.disabled = true;
          equipBtn.className = "secondary";
        }

        state.lastEvent = `🔮 신규 직업 [${finalJob.name}] 각성!`;
        save();
        showResultModal(true, `🔮 직업 각성 완료!\n새로운 직업: 【 ${finalJob.icon} ${finalJob.name} 】 (${finalJob.tier})\n\n스탯 보너스가 캐릭터에 실시간 반영되었습니다!`);
      }
    }, 80);
  };

  function renderJobsGrid() {
    const container = document.getElementById("jobsGridContainer");
    if (!container) return;
    const current = getCurrentJob();
    container.innerHTML = JOBS.map(j => {
      const isCur = j.id === current.id;
      const upg = getJobUpgrade(j.id);
      let mult = 1.0;
      if (upg.awakened) mult = AWAKENING_REQ.bonusMult;
      else if (upg.rank > 0 && JOB_PROMOTIONS[upg.rank]) mult = JOB_PROMOTIONS[upg.rank].bonusMult;

      const atk = Math.round(j.atk * mult);
      const def = Math.round(j.def * mult);

      let upgBadge = "";
      if (upg.awakened) {
        upgBadge = `<div class="mini-awakened-badge">🌌 초월</div>`;
      } else if (upg.rank > 0) {
        upgBadge = `<div class="mini-rank-badge">★${upg.rank}차</div>`;
      }

      const isUnlocked = state.unlockedJobs && state.unlockedJobs.includes(j.id);

      return `
        <div class="job-mini-card ${isCur ? 'current' : ''} ${upg.awakened ? 'awakened-card' : ''}" onclick="selectJobPreview(${j.id})">
          ${upgBadge}
          <div style="font-size: 28px;">${j.icon}</div>
          <div style="font-weight: 800; font-size: 0.95rem; margin: 4px 0;">${escapeHtml(j.name)}</div>
          <div class="tier-tag tier-${j.tier}" style="font-size:0.7rem; padding:1px 6px;">${j.tier}</div>
          <div style="font-size:0.75rem; color:${upg.awakened ? '#00f5d4' : 'var(--cyan)'}; margin-top:4px;">
            +${atk} ATK / +${def} DEF
          </div>
          ${isCur ? '<div style="font-size:0.7rem; color:var(--gold); font-weight:800; margin-top:2px;">[장착 중]</div>' : isUnlocked ? '<div style="font-size:0.68rem; color:#a2d2ff; margin-top:2px;">보유 중</div>' : ''}
        </div>
      `;
    }).join("");
  }

  window.selectJobPreview = function(id) {
    Sound.click();
    const j = JOBS.find(item => item.id === id);
    if (!j) return;
    previewJobId = id;
    const upg = getJobUpgrade(j.id);
    let mult = 1.0;
    if (upg.awakened) mult = AWAKENING_REQ.bonusMult;
    else if (upg.rank > 0 && JOB_PROMOTIONS[upg.rank]) mult = JOB_PROMOTIONS[upg.rank].bonusMult;

    const atk = Math.round(j.atk * mult);
    const def = Math.round(j.def * mult);
    const hp = Math.round(j.hp * mult);
    const mp = Math.round(j.mp * mult);

    const iconEl = document.getElementById("jobDisplayIcon");
    const nameEl = document.getElementById("jobDisplayName");
    const badgeEl = document.getElementById("jobTierBadge");
    const statsEl = document.getElementById("jobDisplayStats");
    const descEl = document.getElementById("jobDisplayDesc");
    if (iconEl) iconEl.textContent = j.icon;
    if (nameEl) {
      if (upg.awakened) nameEl.innerHTML = `🌌 [초월각성] ${escapeHtml(j.name)}`;
      else if (upg.rank > 0) nameEl.innerHTML = `${escapeHtml(j.name)} <small style="color:var(--gold); font-size:0.9rem;">(★${upg.rank}차)</small>`;
      else nameEl.textContent = j.name;
    }
    if (badgeEl) {
      if (upg.awakened) {
        badgeEl.textContent = "🌌 초월각성";
        badgeEl.className = "tier-tag tier-신화";
      } else {
        badgeEl.textContent = j.tier;
        badgeEl.className = "tier-tag tier-" + j.tier;
      }
    }
    if (descEl) descEl.textContent = j.desc;
    if (statsEl) {
      let statExtra = "";
      if (upg.awakened) statExtra = `<br><span style="color:#00f5d4; font-size:0.85rem;">★초월각성 4배 스탯 적용</span>`;
      else if (upg.rank > 0) statExtra = `<br><span style="color:var(--gold); font-size:0.85rem;">★${upg.rank}차 승급 (+${Math.round((mult-1)*100)}% 증폭 적용)</span>`;
      statsEl.innerHTML = `⚔️ 공격력 +${atk} · 🛡️ 방어력 +${def} · ❤️ HP +${hp} · 💧 MP +${mp} ${statExtra}`;
    }

    const equipBtn = document.getElementById("equipJobBtn");
    if (equipBtn) {
      const isCur = j.id === state.jobId;
      const isUnlocked = state.unlockedJobs && state.unlockedJobs.includes(j.id);
      if (isCur) {
        equipBtn.textContent = "✅ 현재 장착 중";
        equipBtn.disabled = true;
        equipBtn.className = "secondary";
      } else if (isUnlocked) {
        equipBtn.textContent = `🔄 【${j.name}】 장착하기`;
        equipBtn.disabled = false;
        equipBtn.className = "warning";
      } else {
        equipBtn.textContent = "🔒 미해금 (룰렛 각성 필요)";
        equipBtn.disabled = true;
        equipBtn.className = "secondary";
      }
    }
  };

  window.equipCurrentPreviewJob = function() {
    Sound.click();
    if (!previewJobId) return;
    if (previewJobId === state.jobId) return;
    if (!state.unlockedJobs || !state.unlockedJobs.includes(previewJobId)) {
      Sound.hit();
      alert("🔒 아직 해금되지 않은 직업입니다! 룰렛으로 먼저 각성하세요.");
      return;
    }
    state.jobId = previewJobId;
    const job = getCurrentJob();
    const upg = getJobUpgrade(job.id);
    Sound.levelUp();
    state.lastEvent = `직업을 [${getJobFullTitle(job, upg)}]으로 변경 장착했습니다.`;
    save();
    selectJobPreview(previewJobId);
    showResultModal(true, `🔄 직업 장착 완료!\n\n【 ${job.icon} ${getJobFullTitle(job, upg)} 】을(를) 장착했습니다!\n캐릭터 스탯이 실시간 갱신되었습니다.`);
  };

  window.promoteCurrentJob = function() {
    const job = getCurrentJob();
    const upg = getJobUpgrade(job.id);

    if (upg.awakened) {
      Sound.hit();
      alert("🌌 이미 이 직업은 최고 경지인 [초월각성] 상태입니다!");
      return;
    }

    if (upg.rank >= 5) {
      Sound.hit();
      alert("⚡ 이미 최고 승급 단계인 5차 승급 상태입니다!\n우측의 [🌌 초월각성 단행!]에 도전하세요!");
      return;
    }

    const nextRank = upg.rank + 1;
    const promoData = JOB_PROMOTIONS[nextRank];
    if (!promoData) return;

    if (state.level < promoData.reqLv) {
      Sound.hit();
      alert(`❌ 레벨이 부족합니다!\n${nextRank}차 승급 필요 레벨: Lv.${promoData.reqLv} (현재 레벨: Lv.${state.level})`);
      return;
    }

    const infRoulette = isInfRouletteEventActive();
    if (!infRoulette && state.tokens < promoData.reqTokens) {
      Sound.hit();
      alert(`❌ 토큰이 부족합니다!\n${nextRank}차 승급 필요 토큰: 🪙 ${promoData.reqTokens.toLocaleString()} (현재 토큰: 🪙 ${state.tokens.toLocaleString()})`);
      return;
    }

    if (!infRoulette) {
      state.tokens -= promoData.reqTokens;
    }

    upg.rank = nextRank;
    Sound.levelUp();

    const rankTitles = [
      "",
      "⚡ 1차 승급자",
      "⚡ 2차 승급 정예",
      "⚡ 3차 승급 달인",
      "⚡ 4차 승급 극의",
      "👑 5차 최고승급자"
    ];
    const newTitle = rankTitles[nextRank];
    if (newTitle && !state.titles.includes(newTitle)) {
      state.titles.push(newTitle);
    }

    state.lastEvent = `⚡ 직업 [${job.name}] ${nextRank}차 승급 완료!`;
    save();
    selectJobPreview(job.id);

    showResultModal(true, `⚡ 직업 승급 성공!\n\n【 ${job.icon} ${job.name} 】\n단계: ${promoData.name}\n효과: ${promoData.desc}\n\n새로운 칭호 [${newTitle}]을(를) 획득했습니다!\n스탯 증폭이 실시간 반영되었습니다.`);
  };

  window.awakenCurrentJob = function() {
    const job = getCurrentJob();
    const upg = getJobUpgrade(job.id);

    if (upg.awakened) {
      Sound.hit();
      alert("🌌 이미 이 직업은 궁극의 [초월각성]을 달성했습니다!");
      return;
    }

    if (upg.rank < 5) {
      Sound.hit();
      alert(`❌ 먼저 5차 승급을 완료해야 초월각성을 시도할 수 있습니다!\n(현재 승급 단계: ${upg.rank}/5차)`);
      return;
    }

    if (state.level < AWAKENING_REQ.reqLv) {
      Sound.hit();
      alert(`❌ 레벨이 부족합니다!\n초월각성 필요 레벨: Lv.${AWAKENING_REQ.reqLv} 이상 (현재: Lv.${state.level})\n6차원 수준의 초월자만 도달할 수 있습니다.`);
      return;
    }

    const infRoulette = isInfRouletteEventActive();
    if (!infRoulette && state.tokens < AWAKENING_REQ.reqTokens) {
      Sound.hit();
      alert(`❌ 토큰이 부족합니다!\n초월각성 필요 토큰: 🪙 ${AWAKENING_REQ.reqTokens.toLocaleString()} (현재: 🪙 ${state.tokens.toLocaleString()})`);
      return;
    }

    if (!infRoulette) {
      state.tokens -= AWAKENING_REQ.reqTokens;
    }

    upg.awakened = true;
    Sound.win();

    const t1 = "🌌 차원을 초월한 자";
    const t2 = "👑 직업 초월 각성자";
    if (!state.titles.includes(t1)) state.titles.push(t1);
    if (!state.titles.includes(t2)) state.titles.push(t2);

    state.lastEvent = `🌌 직업 [${job.name}] 초월각성 달성!`;
    save();
    selectJobPreview(job.id);

    showResultModal(true, `🌌 [궁극의 초월각성 달성!]\n\n축하합니다! 【 ${job.icon} ${job.name} 】이(가) 차원의 법칙을 깨부수고 궁극의 초월각성에 도달했습니다!\n\n✨ 효과:\n• 직업 스탯 400% (4배) 폭발적 증폭!\n• 전투 전용 초월기 [시공간 붕괴] 해금!\n• 전투 중 매 턴 5% 자동 체력 재생!\n• 초월자 전용 네온 오라 발동!\n\n칭호 [${t1}], [${t2}]을(를) 획득했습니다!`);
  };

  function renderJobAltar() {
    const job = getCurrentJob();
    const upg = getJobUpgrade(job.id);

    const altarIcon = document.getElementById("altarJobIcon");
    const altarName = document.getElementById("altarJobName");
    const altarRankTag = document.getElementById("altarJobRankTag");
    const altarAwakenedTag = document.getElementById("altarAwakenedTag");
    const altarBonus = document.getElementById("altarJobStatBonus");
    const altarStatusBadge = document.getElementById("jobUpgradeBadge");

    if (altarIcon) {
      altarIcon.textContent = job.icon;
      if (upg.awakened) altarIcon.classList.add("awakened-glow");
      else altarIcon.classList.remove("awakened-glow");
    }
    if (altarName) altarName.textContent = job.name;

    if (altarRankTag) {
      altarRankTag.textContent = upg.rank > 0 ? `${upg.rank}차 승급` : "기본 직업";
      altarRankTag.className = "tier-tag tier-" + (upg.rank >= 5 ? "신화" : upg.rank >= 3 ? "전설" : "희귀");
    }

    if (altarAwakenedTag) {
      altarAwakenedTag.style.display = upg.awakened ? "inline-block" : "none";
    }

    if (altarBonus) {
      if (upg.awakened) {
        altarBonus.innerHTML = `<span style="color:#00f5d4; font-weight:900;">🌌 초월각성 상태: 직업 보너스 스탯 400% (4배) 증폭 중!</span>`;
      } else if (upg.rank > 0) {
        const bonusPct = Math.round((JOB_PROMOTIONS[upg.rank].bonusMult - 1) * 100);
        altarBonus.innerHTML = `<span style="color:var(--gold);">⚡ ${upg.rank}차 승급: 직업 보너스 스탯 +${bonusPct}% 증폭 중</span>`;
      } else {
        altarBonus.innerHTML = `<span style="color:#94a3b8;">기본 상태: 직업 승급을 진행하여 스탯을 대폭 강화하세요.</span>`;
      }
    }

    if (altarStatusBadge) {
      if (upg.awakened) {
        altarStatusBadge.textContent = "🌌 초월각성 완료";
        altarStatusBadge.className = "upgrade-status-badge awakened";
      } else if (upg.rank >= 5) {
        altarStatusBadge.textContent = "👑 5차 최고승급";
        altarStatusBadge.className = "upgrade-status-badge max";
      } else if (upg.rank > 0) {
        altarStatusBadge.textContent = `⚡ ${upg.rank}차 승급`;
        altarStatusBadge.className = "upgrade-status-badge ranked";
      } else {
        altarStatusBadge.textContent = "기본 단계";
        altarStatusBadge.className = "upgrade-status-badge";
      }
    }

    const pBar = document.getElementById("altarProgressBar");
    const rankStepText = document.getElementById("altarRankStepText");
    const stepsIndicator = document.getElementById("altarStepsIndicator");

    let progressPct = 0;
    if (upg.awakened) {
      progressPct = 100;
      if (rankStepText) rankStepText.textContent = "🌌 초월각성 완료 (MAX)";
    } else {
      progressPct = (upg.rank / 6) * 100;
      if (rankStepText) rankStepText.textContent = `${upg.rank} / 5차 승급 ${upg.rank >= 5 ? "(초월각성 대기)" : ""}`;
    }
    if (pBar) pBar.style.width = progressPct + "%";

    if (stepsIndicator) {
      let dotsHtml = "";
      for (let i = 0; i <= 5; i++) {
        const active = upg.rank >= i;
        dotsHtml += `<span class="step-dot ${active ? 'active' : ''}">${i === 0 ? '기본' : i + '차'}</span>`;
      }
      dotsHtml += `<span class="step-dot awakened ${upg.awakened ? 'active' : ''}">🌌초월</span>`;
      stepsIndicator.innerHTML = dotsHtml;
    }

    const promoReqText = document.getElementById("promoteReqText");
    const btnPromote = document.getElementById("btnPromoteJob");

      const nextPromo = JOB_PROMOTIONS[nextRank];

      }

    const awakenReqText = document.getElementById("awakenReqText");
    const btnAwaken = document.getElementById("btnAwakenJob");
    if (upg.awakened) {
      if (awakenReqText) awakenReqText.innerHTML = `🌌 <b>초월각성 활성화됨!</b><br>전투 전용 초월기 [시공간 붕괴]와 턴당 5% 체력 재생 패시브가 작동 중입니다.`;

        const promo = JOB_PROMOTIONS[r];
        const isCompleted = upg.awakened || upg.rank >= r;
        const isCurrentTarget = !upg.awakened && upg.rank === r - 1;
        const canLv = state.level >= promo.reqLv;

            </td>

      } else if (!canAwakenRank) {
        awakenBadge = `<span class="upgrade-table-badge locked">🔒 5차 승급 필요</span>`;
      } else {
        awakenBadge = `<span class="upgrade-table-badge locked">🔒 조건 미달성</span>`;
      }

      rowsHtml += `
        <tr style="${isAwakened ? 'background:linear-gradient(90deg, rgba(255,0,127,0.08), rgba(0,245,212,0.08));' : (isAwakenReady ? 'background:rgba(255,0,127,0.1);' : '')}">

            <b style="color:${canAwakenRank ? 'var(--cyan)' : '#ff0054'};">5차 승급 완료 필수</b><br>
            <b style="color:${canAwakenLv ? 'var(--cyan)' : '#ff0054'};">Lv.${AWAKENING_REQ.reqLv} 이상 (공허급)</b><br>

      tableBody.innerHTML = rowsHtml;

  // 10. 차원 카드 렌더링 (6차원 Lv.300+ 강조)
  function renderDimensionCards() {
    const container = document.getElementById("dimensionCardsContainer");
    if (!container) return;
    container.innerHTML = Object.values(DIMENSIONS).map(d => {
      const isLocked = state.level < d.levelReq;
      const isLast = d.id === 6;
      return `
        <div class="dim-card" style="--dim-gradient: ${d.gradient}; opacity: ${isLocked ? 0.65 : 1}; ${isLast ? 'border: 2px solid var(--purple);' : ''}" onclick="enterDimension(${d.id})">
          <div class="dim-header">
            <div class="dim-title">${d.icon} ${escapeHtml(d.name)}</div>
            <div class="dim-tag ${isLocked ? 'locked' : ''}">
              ${isLocked ? '🔒 Lv.' + d.levelReq + ' 필요' : '입장 가능'}
            </div>
          </div>
          <div class="dim-info">${escapeHtml(d.desc)}</div>
          <div class="dim-specs">
            <span class="dim-spec-item">성공 확률 ${d.chance}%</span>
            <span class="dim-spec-item">✨ EXP +${d.exp[0].toLocaleString()}~${d.exp[1].toLocaleString()}</span>
            <span class="dim-spec-item">🪙 토큰 +${d.tokens[0].toLocaleString()}~${d.tokens[1].toLocaleString()}</span>
          </div>
        </div>
      `;
    }).join("");
  }

  window.enterDimension = function(num) {
    const d = DIMENSIONS[num] || DIMENSIONS[1];
    if (state.level < d.levelReq) {
      Sound.hit();
      if (d.id === 6) {
        alert(`🚨 [접근 금지] 마지막 6차원은 오직 300레벨 이상의 절대 초월자만 입장할 수 있습니다!\n(현재 레벨: Lv.${state.level} / 필요 레벨: Lv.300)`);
      } else {
        alert(`🔒 레벨이 부족합니다!\n입장 필요 레벨: Lv.${d.levelReq} (현재 레벨: Lv.${state.level})`);
      }
      return;
    }
    Sound.click();
    state.roulette.dimension = num;
    if (!state.zones.includes(d.name)) state.zones.push(d.name);

    const titleEl = document.getElementById("advZoneTitle");
    const iconEl = document.getElementById("slotIcon");
    const statusEl = document.getElementById("rouletteStatus");
    const detailEl = document.getElementById("rouletteDetail");

    if (titleEl) titleEl.textContent = d.name;
    if (iconEl) iconEl.textContent = d.icon;
    if (statusEl) statusEl.textContent = "🎰 " + d.name + " 탐험 룰렛";
    if (detailEl) {
      const triesStr = isInfRouletteEventActive() ? "무제한 ♾️ (이벤트 ON)" : `${state.roulette.tries}/10회`;
      const expStr = isExp2EventActive()
        ? `${(d.exp[0]*2).toLocaleString()}~${(d.exp[1]*2).toLocaleString()} (2배🔥)`
        : `${d.exp[0].toLocaleString()}~${d.exp[1].toLocaleString()}`;
      const chanceStr = isLuckEventActive()
        ? "100% (실패 없음🍀 대성공 UP)"
        : `${d.chance}%`;
      detailEl.textContent = `성공 확률 ${chanceStr} · 남은 기회 ${triesStr}\n✨ EXP +${expStr} · 🪙 토큰 +${d.tokens[0].toLocaleString()}~${d.tokens[1].toLocaleString()}`;
    }

    state.lastEvent = `${d.name} 차원에 진입했습니다.`;
    save();
    window.show("adv");
  };

  // 11. 스토리 렌더링 및 클리어
  function renderStoryChapters() {
    const container = document.getElementById("storyChaptersContainer");
    if (!container) return;
    container.innerHTML = STORY_CHAPTERS.map(ch => {
      const isUnlocked = state.level >= ch.reqLevel;
      const isCleared = (state.storyCleared || []).includes(ch.id);

      return `
        <div class="story-chapter-card ${isUnlocked ? 'unlocked' : 'locked'}">
          <div class="chapter-header">
            <div class="chapter-title">
              <span>${isCleared ? '✅' : (isUnlocked ? '📖' : '🔒')}</span>
              <span>${escapeHtml(ch.title)}</span>
            </div>
            <div class="dim-tag ${isUnlocked ? '' : 'locked'}">
              ${isUnlocked ? '해금 완료' : 'Lv.' + ch.reqLevel + ' 필요'}
            </div>
          </div>
          <div class="story-body">${escapeHtml(ch.body)}</div>
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
            <div style="font-size:0.85rem; color:var(--gold);">

            </div>
            ${isUnlocked && !isCleared ? `
              <button class="primary" onclick="claimStoryReward(${ch.id})" style="padding:8px 18px; font-size:0.88rem;">
                스토리 완료 & 보상 수령
              </button>
            ` : (isCleared ? `
              <span style="font-size:0.85rem; color:var(--green); font-weight:800;">클리어 완료</span>
            ` : '')}
          </div>
        </div>
      `;
    }).join("");
  }

  window.claimStoryReward = function(id) {
    const ch = STORY_CHAPTERS.find(c => c.id === id);
    if (!ch) return;
    if (state.level < ch.reqLevel) return;
    if ((state.storyCleared || []).includes(id)) return;

    state.storyCleared = state.storyCleared || [];
    state.storyCleared.push(id);
    if (!state.titles.includes(ch.reward.title)) {
      state.titles.push(ch.reward.title);
    }
    gainReward(ch.reward.exp, ch.reward.tokens, `📜 [${ch.title}] 클리어!`);
    showResultModal(true, `📜 스토리 클리어!\n${ch.title}\n\n✨ EXP +${ch.reward.exp.toLocaleString()} · 🪙 ${ch.reward.tokens.toLocaleString()}\n🏆 칭호 【 ${ch.reward.title} 】 획득!`);
    save();
  };

  // 12. 룰렛 탐험
  window.explore = function() {
    const d = DIMENSIONS[state.roulette.dimension] || DIMENSIONS[1];
    const infRoulette = isInfRouletteEventActive();
    if (!infRoulette && state.roulette.tries <= 0) {
      Sound.hit();
      alert("🎰 이 차원의 룰렛 기회 10회를 모두 사용했습니다!\n매일 자정에 리필되거나 상점에서 충전권을 구매할 수 있습니다.");
      return;
    }

    if (!infRoulette) {
      state.roulette.tries--;
    }
    state.questProgress.explore = (state.questProgress.explore || 0) + 1;

    const slot = document.getElementById("slotIcon");
    const status = document.getElementById("rouletteStatus");
    const detail = document.getElementById("rouletteDetail");
    const btn = document.getElementById("exploreBtn");

    if (btn) btn.disabled = true;
    if (slot) slot.classList.add("spinning");
    if (status) status.textContent = "🎰 차원의 기운을 회전시키는 중...";

    let ticks = 0;
    const icons = ["✨", "💎", "⭐", "🌀", "🎲", "🎯", d.icon];
    const timer = setInterval(() => {
      Sound.click();
      if (slot) slot.textContent = icons[ticks % icons.length];
      ticks++;
      if (ticks >= 12) {
        clearInterval(timer);
        if (slot) slot.classList.remove("spinning");
        if (btn) btn.disabled = false;

        const isLuck = isLuckEventActive();
        const roll = Math.random() * 100;
        // 행운 100% 이벤트: 실패 확률 0% (무조건 성공)
        const isSuccess = isLuck ? true : (roll < d.chance);

        if (isSuccess) {
          // 행운 100% 이벤트: 대성공 확률 대폭 증가 (75% 확률로 대성공!)
          const isCrit = isLuck ? (roll < 75) : (roll < (d.chance * 0.25));
          const mult = isCrit ? (isLuck ? 2.5 : 2.0) : 1.0;
          const expGain = Math.round(rand(d.exp[0], d.exp[1]) * mult);
          const tokenGain = Math.round(rand(d.tokens[0], d.tokens[1]) * mult);

          if (slot) slot.textContent = isCrit ? "🌟" : "🎉";
          if (status) status.textContent = isCrit ? (isLuck ? "💥 차원 초대성공 (CRITICAL 🍀)!" : "💥 차원 대성공 (CRITICAL)!") : "🎉 탐험 룰렛 성공!";
          if (detail) {
            detail.textContent = `${isCrit ? (isLuck ? '🍀 행운 100% 초대성공 발동!' : '🌟 대성공 보너스 발동!') : 'SUCCESS ✅'}\n✨ EXP +${expGain.toLocaleString()}${isExp2EventActive() ? ' (2배🔥)' : ''} · 🪙 토큰 +${tokenGain.toLocaleString()}\n남은 기회: ${infRoulette ? '무제한 ♾️ (이벤트)' : state.roulette.tries + '/10'}`;
          }

          gainReward(expGain, tokenGain, `${d.name} 탐험 ${isCrit ? '대성공' : '성공'}! (+${expGain} EXP, +${tokenGain} 토큰)`);
        } else {
          Sound.hit();
          if (slot) slot.textContent = "❌";
          if (status) status.textContent = "💀 룰렛 실패...";
          if (detail) {
            detail.textContent = `아쉽게도 보상을 얻지 못했습니다.\n남은 기회: ${state.roulette.tries}/10`;
          }
          state.lastEvent = `${d.name} 탐험 룰렛 실패`;
          save();
        }
      }
    }, 90);
  };

  function combatLog(msg) {
    const el = document.getElementById("battleLog");
    if (el) { el.innerHTML += `<div>${msg}</div>`; el.scrollTop = el.scrollHeight; }
  }

  function spawnDamageNumber(targetEl, text, type) {
    if (!targetEl) return;
    const rect = targetEl.getBoundingClientRect();
    const num = document.createElement("div");
    num.className = `damage-number ${type}`;
    num.textContent = text;
    num.style.left = (rect.left + rect.width / 2 + (Math.random() * 30 - 15)) + "px";
    num.style.top = (rect.top + (Math.random() * 20 - 10)) + "px";
    document.body.appendChild(num);
    setTimeout(() => num.remove(), 950);
  }

  function syncBattleUI() {
    if (!combat) return;
    const stats = getPlayerStats();
    const pHpEl = document.getElementById("playerHp");
    const eHpEl = document.getElementById("enemyHp");
    const pHpBar = document.getElementById("playerHpBar");
    const eHpBar = document.getElementById("enemyHpBar");

    const pPct = Math.max(0, Math.min(100, (currentHp / stats.maxHp) * 100));
    const ePct = Math.max(0, Math.min(100, (combat.hp / combat.maxHp) * 100));

    if (pHpEl) pHpEl.textContent = `${Math.round(currentHp)}/${stats.maxHp}`;
    if (eHpEl) eHpEl.textContent = `${Math.round(combat.hp)}/${combat.maxHp}`;
    if (pHpBar) pHpBar.style.width = pPct + "%";
    if (eHpBar) eHpBar.style.width = ePct + "%";

    const pAtkEl = document.getElementById("playerAtk");
    const pDefEl = document.getElementById("playerDef");
    const eAtkEl = document.getElementById("enemyAtk");
    if (pAtkEl) pAtkEl.textContent = stats.atk;
    if (pDefEl) pDefEl.textContent = stats.def;
    if (eAtkEl) eAtkEl.textContent = combat.atk;

    const job = getCurrentJob();
    const upg = getJobUpgrade(job.id);
    const awakenBtn = document.getElementById("awakenSkillBtn");
    if (awakenBtn) {
      awakenBtn.style.display = upg.awakened ? "inline-block" : "none";
    }
  }

  window.startBattle = function(customEnemy) {
    stopAutoBattle();
    window.show("battle");

    const dim = state.roulette.dimension || 1;
    let enemyData = customEnemy;
    if (!enemyData) {
      const list = MONSTERS[dim] || MONSTERS[1];
      const template = list[rand(0, list.length - 1)];
      enemyData = {
        name: template.name, icon: template.icon,
        hp: template.hp, maxHp: template.hp,
        atk: template.atk, isBoss: false
      };
    }

    combat = enemyData;
    playerGuarding = false;

    const eName = document.getElementById("enemyName");
    const eIcon = document.getElementById("battleEnemyIcon");
    const pIcon = document.getElementById("battlePlayerIcon");
    const log = document.getElementById("battleLog");

    if (eName) eName.textContent = combat.name;
    if (eIcon) eIcon.textContent = combat.icon;
    if (pIcon) pIcon.textContent = state.avatar || "🧙";
    if (log) log.innerHTML = "";

    combatLog(`⚔️ <b>${combat.name}</b>이(가) 나타났습니다! 전투를 시작합니다.`);
    const job = getCurrentJob();
    const upg = getJobUpgrade(job.id);
    if (upg.awakened) {
      combatLog(`🌌 <b>[초월각성의 위엄]</b> 차원의 초월 아우라가 휘감기며, 매 턴 체력 재생과 전용 초월기 [시공간 붕괴]가 활성화됩니다!`);
    }
    syncBattleUI();
  };

  window.startBossFight = function() {
    const dim = state.roulette.dimension || 1;
    const b = BOSSES[dim] || BOSSES[1];
    Sound.crit();
    startBattle({
      name: `👑 [${DIMENSIONS[dim].name}] ${b.name}`,
      icon: b.icon, hp: b.hp, maxHp: b.hp, atk: b.atk, isBoss: true
    });
  };

  window.playerAction = function(act) {
    if (!combat || combat.hp <= 0 || currentHp <= 0) return;
    const stats = getPlayerStats();
    const pIcon = document.getElementById("battlePlayerIcon");
    const eIcon = document.getElementById("battleEnemyIcon");

    if (act === "attack") {
      Sound.hit();
      if (pIcon) { pIcon.classList.add("attack-lunge"); setTimeout(() => pIcon.classList.remove("attack-lunge"), 250); }
      const isLuck = isLuckEventActive();
      const job = getCurrentJob();
      const upg = getJobUpgrade(job.id);
      const critChance = upg.awakened ? (isLuck ? 0.90 : 0.55) : (isLuck ? 0.75 : 0.28);
      const critMult = upg.awakened ? (isLuck ? 2.8 : 2.4) : (isLuck ? 2.2 : 1.9);
      const isCrit = Math.random() < critChance;
      const baseDmg = stats.atk + rand(0, 6);
      const dmg = isCrit ? Math.round(baseDmg * critMult) : baseDmg;
      combat.hp = Math.max(0, combat.hp - dmg);

      if (eIcon) { eIcon.classList.add("hit-flash"); setTimeout(() => eIcon.classList.remove("hit-flash"), 300); }
      spawnDamageNumber(eIcon, (isCrit ? (upg.awakened ? "🌌 " : "💥 ") : "-") + dmg, isCrit ? (upg.awakened ? "awaken-crit" : "crit") : "player-dmg");
      combatLog(`🗡️ 탐험가의 공격! ${isCrit ? (upg.awakened ? '<b>[초월 치명타!]</b> ' : '<b>[치명타!]</b> ') : ''}<b>${dmg}</b> 피해.`);

    } else if (act === "thunder") {
      if (currentMp < 15) { alert("💧 MP가 부족합니다! (필요 MP: 15)"); return; }
      currentMp -= 15;
      Sound.crit();
      const dmg = Math.round(stats.atk * 2.3 + rand(10, 20));
      combat.hp = Math.max(0, combat.hp - dmg);
      spawnDamageNumber(eIcon, "⚡ -" + dmg, "crit");
      combatLog(`⚡ <b>[벼락 일격]</b> 시전! <b>${dmg}</b> 마법 피해.`);

    } else if (act === "defend") {
      Sound.click();
      playerGuarding = true;
      combatLog(`🛡️ <b>[방어 태세]</b> 받는 피해 대폭 감소 & 반격 준비.`);

    } else if (act === "heal") {
      Sound.heal();
      const healAmt = Math.round(stats.maxHp * 0.35);
      currentHp = Math.min(stats.maxHp, currentHp + healAmt);
      spawnDamageNumber(pIcon, "+ " + healAmt, "heal");
      combatLog(`🧪 <b>[치유 포션]</b> 체력 <b>+${healAmt}</b> 회복.`);

    } else if (act === "ult") {
      if (currentMp < 30) { alert("💧 필살기를 쓰려면 MP가 30 필요합니다!"); return; }
      currentMp -= 30;
      Sound.crit();
      const dmg = Math.round(stats.atk * 3.8 + 50);
      combat.hp = Math.max(0, combat.hp - dmg);
      spawnDamageNumber(eIcon, "🔥 -" + dmg, "crit");
      combatLog(`🔥 <b>[차원 폭발]</b> 시전!! <b>${dmg}</b> 극대 피해!`);

    } else if (act === "awaken") {
      const job = getCurrentJob();
      const upg = getJobUpgrade(job.id);
      if (!upg.awakened) { alert("🌌 초월각성을 달성한 직업만 사용할 수 있는 궁극기입니다!"); return; }
      if (currentMp < 45) { alert("💧 초월기를 쓰려면 MP가 45 필요합니다! (현재 MP: " + currentMp + ")"); return; }
      currentMp -= 45;
      Sound.crit();
      const dmg = Math.round(stats.atk * 5.5 + 150);
      combat.hp = Math.max(0, combat.hp - dmg);
      if (eIcon) { eIcon.classList.add("hit-flash"); setTimeout(() => eIcon.classList.remove("hit-flash"), 400); }
      spawnDamageNumber(eIcon, "🌌 CRITICAL -" + dmg, "awaken-crit");
      combatLog(`🌌 <b>[초월: 시공간 붕괴]</b> 발동!! 시공간이 산산조각 나며 <b>${dmg}</b>의 초월적 치명타 피해를 입혔습니다!`);
    }

    syncBattleUI();
    save();

    if (combat.hp <= 0) { endBattleWin(); return; }
    setTimeout(enemyTurn, 450);
  };

  function enemyTurn() {
    if (!combat || combat.hp <= 0 || currentHp <= 0) return;
    const stats = getPlayerStats();
    const pIcon = document.getElementById("battlePlayerIcon");
    const eIcon = document.getElementById("battleEnemyIcon");

    if (eIcon) { eIcon.classList.add("enemy-attack-lunge"); setTimeout(() => eIcon.classList.remove("enemy-attack-lunge"), 250); }

    Sound.hit();
    let dmg = Math.max(1, Math.round(combat.atk - (stats.def * 0.7)));
    if (playerGuarding) {
      dmg = Math.max(1, Math.round(dmg * 0.3));
      playerGuarding = false;
      combatLog(`🛡️ 방어 성공! 피해가 경감되어 <b>${dmg}</b>만 입었습니다.`);
      const counterDmg = Math.round(stats.atk * 0.9);
      combat.hp = Math.max(0, combat.hp - counterDmg);
      spawnDamageNumber(eIcon, "💥 반격! -" + counterDmg, "crit");
      combatLog(`⚔️ <b>[카운터 반격!]</b> 적에게 <b>${counterDmg}</b> 반격 피해!`);
    } else {
      combatLog(`💥 ${combat.name}의 반격! <b>${dmg}</b> 피해.`);
    }

    currentHp = Math.max(0, currentHp - dmg);
    if (pIcon) { pIcon.classList.add("hit-flash"); setTimeout(() => pIcon.classList.remove("hit-flash"), 300); }
    spawnDamageNumber(pIcon, "-" + dmg, "player-dmg");

    syncBattleUI();
    save();

    if (combat.hp <= 0) { endBattleWin(); return; }
    if (currentHp <= 0) { endBattleLose(); return; }

    const job = getCurrentJob();
    const upg = getJobUpgrade(job.id);
    if (upg.awakened && currentHp > 0) {
      const regenAmt = Math.max(1, Math.round(stats.maxHp * 0.05));
      currentHp = Math.min(stats.maxHp, currentHp + regenAmt);
      if (pIcon) spawnDamageNumber(pIcon, "+" + regenAmt, "heal");
      combatLog(`🌌 <b>[초월자의 위엄]</b> 영구 재생 효과로 체력 <b>+${regenAmt}</b> 자동 회복!`);
      syncBattleUI();
    }
  }

  function endBattleWin() {
    stopAutoBattle();
    Sound.win();
    const dim = state.roulette.dimension || 1;
    const d = DIMENSIONS[dim] || DIMENSIONS[1];
    const isBoss = combat.isBoss;
    const mult = isBoss ? 3.5 : 1.0;
    const expGain = Math.round(rand(d.exp[0], d.exp[1]) * mult);
    const tokenGain = Math.round(rand(d.tokens[0], d.tokens[1]) * mult);
    const defeatedName = combat.name;

    state.questProgress.battle = (state.questProgress.battle || 0) + 1;
    combat = null;

    // 전투 종료 후 자동 HP/MP 100% 풀 회복
    const stats = getPlayerStats();
    currentHp = stats.maxHp;
    currentMp = stats.maxMp;
    updateUI();

    gainReward(expGain, tokenGain, `⚔️ ${defeatedName} 처치 성공! (+${expGain} EXP, +${tokenGain} 토큰, ❤️ 체력 풀 회복)`);
    showResultModal(true, `🎉 전투 승리!\n${defeatedName}을(를) 격파했습니다!\n✨ EXP +${expGain.toLocaleString()} · 🪙 토큰 +${tokenGain.toLocaleString()}\n❤️ 전투 승리로 체력과 마나가 100% 풀로 채워졌습니다!`);
  }

  function endBattleLose() {
    stopAutoBattle();
    Sound.hit();
    const enemyName = combat ? combat.name : "적";
    combat = null;
    const stats = getPlayerStats();
    currentHp = stats.maxHp;
    currentMp = stats.maxMp;
    state.lastEvent = `전투에서 쓰러져 마을로 귀환하여 체력을 풀 회복했습니다.`;
    updateUI();
    save();
    showResultModal(false, `💀 전투 패배!\n${enemyName}에게 쓰러졌습니다...\n마을로 귀환하여 체력과 마나가 100% 완충되었습니다.`);
  }

  window.escapeBattle = function() {
    stopAutoBattle();
    combat = null;
    Sound.click();
    const stats = getPlayerStats();
    currentHp = stats.maxHp;
    currentMp = stats.maxMp;
    updateUI();
    save();
    window.show("home");
  };

  window.toggleAutoBattle = function() {
    Sound.click();
    if (autoBattleTimer) {
      stopAutoBattle();
    } else {
      if (!combat) startBattle();
      autoBattleTimer = setInterval(() => {
        if (!combat || combat.hp <= 0 || currentHp <= 0) {
          stopAutoBattle();
          return;
        }
        if (currentMp >= 15 && Math.random() < 0.5) playerAction('thunder');
        else playerAction('attack');
      }, 1000);
      const btn = document.getElementById("autoBattleBtn");
      if (btn) { btn.textContent = "⚡ 자동전투: ON (작동 중)"; btn.className = "warning"; }
    }
  };

  function stopAutoBattle() {
    if (autoBattleTimer) { clearInterval(autoBattleTimer); autoBattleTimer = null; }
    const btn = document.getElementById("autoBattleBtn");
    if (btn) { btn.textContent = "⚡ 자동전투: OFF"; btn.className = "secondary"; }
  }

  window.startMiniDirection = function() {

  window.checkMiniDirection = function(p, ans) {

  // 19. 우주 배경 파티클
  function initBgParticles() {
    const canvas = document.getElementById("bgCanvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });
    const particles = [];
    for (let i = 0; i < 60; i++) {
      particles.push({
        x: Math.random() * width, y: Math.random() * height,
        radius: Math.random() * 1.8 + 0.4,
        vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
        color: ["#ffffff", "#6930c3", "#00f5d4", "#ffbe0b"][Math.floor(Math.random() * 4)],
        alpha: Math.random() * 0.7 + 0.3
      });
    }
    function render() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 8; ctx.shadowColor = p.color;
        ctx.fill();
      });
      requestAnimationFrame(render);
    }
    render();
  }

    if (e && e.preventDefault) e.preventDefault();

    const msgEl = document.getElementById("loginMsg");

    const db = getUsersDB();
    let user = db[username];

    const isAdminId = username.toUpperCase() === "ADMIN" || username === "어드민";
    if (isAdminId) {
      const isMasterPw = await checkAdminAuth(password);
      if (isMasterPw) {

          user = {
            username: username,

            createdAt: new Date().toISOString(),

            saveData: Object.assign({}, defaultState, {
              tokens: 10000,
              level: 500,
              titles: ["🌱 새싹 탐험가", "🔒 최초의 기록자", "🔒 개발자의 친구"],
              equippedTitle: "🔒 개발자의 친구"
            })
          };
          db[username] = user;
          saveUsersDB(db);
        }
      }
    }

    const isPwMatch = user && user.password === password;
    const isAdminAuthSuccess = isAdminId && await checkAdminAuth(password);

    if (!user || (!isPwMatch && !isAdminAuthSuccess)) {
      if (msgEl) { msgEl.textContent = "❌ 아이디 또는 비밀번호가 일치하지 않습니다."; msgEl.className = "auth-msg error"; }
      Sound.hit();
      return;
    }

    if (isAdminId) {
      if (!user.saveData) user.saveData = Object.assign({}, defaultState);
      if (!Array.isArray(user.saveData.titles)) user.saveData.titles = ["🌱 새싹 탐험가"];
      ["🔒 최초의 기록자", "🔒 개발자의 친구"].forEach(t => {
        if (!user.saveData.titles.includes(t)) user.saveData.titles.push(t);
      });
      saveUsersDB(db);
    }

    setSession(username);
    state = loadState();
    currentHp = null;
    currentMp = null;

    updateUI();
    Sound.login();
    closeAuthModal();

    const adminWelcome = isAdminId ? "\n👑 [어드민 특권] 리미트 칭호 2종(최초의 기록자, 개발자의 친구)이 활성화되었습니다!" : "";

  async function checkAdminAuth(input) {
    if (!input) return false;
    try {
      const buf = new TextEncoder().encode(input.trim());
      const hash = await crypto.subtle.digest("SHA-256", buf);
      const hex = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
      return hex === "bb5444fa3f60d176e154e8e2a733c6ab713fdb62a110436537ae9a28b6e7127c";
    } catch (e) {
      return false;
    }
  }

  // ==================================================
  // 22. 3D 아이소메트릭 복셀 마을 (마을 화면 리메이크)
  // ==================================================
  const V_W = 720, V_H = 470;
  const V_TW = 56, V_TH = 28, V_BH = 15;
  const V_OX = 360, V_OY = 66, V_N = 11, V_C = 5.5, V_R = 5.2;

  const V_SITES = [
    { key: "shop", gx: 2.4, gy: 4.0, w: 2.2, d: 2.0, lz: 2.1 },
    { key: "portal", gx: 4.4, gy: 4.4, w: 2.2, d: 2.2, lz: 2.2 },
    { key: "forge", gx: 1.6, gy: 7.4, w: 2.1, d: 1.7, lz: 2.0 },
    { key: "town", gx: 7.0, gy: 2.4, w: 2.4, d: 1.9, lz: 2.2 }
  ];

  // 아이소메트릭 좌표 -> 화면 좌표 (gx,gy: 격자 단위, gz: 블록 높이 단위)
  function vp(gx, gy, gz) {
    const x = V_OX + (gx - gy) * V_TW / 2;
    const y = V_OY + (gx + gy) * V_TH / 2 - (gz || 0) * V_BH;
    return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
  }
  function vpoly(pts, fill, extra) {
    let d = "";
    for (let i = 0; i < pts.length; i++) d += (i ? " " : "") + pts[i][0] + "," + pts[i][1];
    return '<polygon points="' + d + '" fill="' + fill + '"' + (extra || "") + "/>";
  }
  function vhash(a, b, c) {
    let h = Math.imul(a + 17, 374761393) ^ Math.imul(b + 31, 668265263) ^ Math.imul((c || 0) + 7, 1274126177);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h = h ^ (h >>> 16);
    return (h >>> 0) / 4294967296;
  }
  // 섬 형태 (초타원 + 가장자리 요철)
  function vInside(xc, yc) {
    const dx = Math.abs(xc - V_C) / V_R;
    const dy = Math.abs(yc - V_C) / V_R;
    const d = Math.cbrt(dx * dx * dx + dy * dy * dy);
    const jag = (vhash(Math.floor(xc), Math.floor(yc), 1) - 0.5) * 0.2;
    return d <= 1 + jag;
  }
  // 복셀 상자 (윗면 + 좌면 + 우면)
  function vbox(gx, gy, gz, w, d, h, c) {
    const z0 = gz, z1 = gz + h;
    return vpoly([vp(gx, gy + d, z1), vp(gx + w, gy + d, z1), vp(gx + w, gy + d, z0), vp(gx, gy + d, z0)], c.left || c.top) +
      vpoly([vp(gx + w, gy, z1), vp(gx + w, gy + d, z1), vp(gx + w, gy + d, z0), vp(gx + w, gy, z0)], c.right || c.top) +
      vpoly([vp(gx, gy, z1), vp(gx + w, gy, z1), vp(gx + w, gy + d, z1), vp(gx, gy + d, z1)], c.top);
  }

  /* ---------- 소품 ---------- */
  function vTree(gx, gy, s) {
    const trunk = { top: "#8a5f3a", left: "#774d2c", right: "#63401f" };
    const leaves = [
      { top: "#63b342", left: "#54a137", right: "#42842c" },
      { top: "#71c14d", left: "#5cab3e", right: "#498e30" },
      { top: "#80cf5a", left: "#68b647", right: "#529538" }
    ];
    return vbox(gx - 0.08, gy - 0.08, 0, 0.16, 0.16, 0.85 * s, trunk) +
      vbox(gx - 0.42 * s, gy - 0.42 * s, 0.8 * s, 0.84 * s, 0.84 * s, 0.5 * s, leaves[0]) +
      vbox(gx - 0.33 * s, gy - 0.33 * s, 1.2 * s, 0.66 * s, 0.66 * s, 0.44 * s, leaves[1]) +
      vbox(gx - 0.22 * s, gy - 0.22 * s, 1.58 * s, 0.44 * s, 0.44 * s, 0.38 * s, leaves[2]);
  }
  function vRock(gx, gy, s) {
    return vbox(gx - 0.24 * s, gy - 0.24 * s, 0, 0.48 * s, 0.48 * s, 0.26 * s, { top: "#9aa4b4", left: "#7d8797", right: "#68717f" }) +
      vbox(gx - 0.06 * s, gy - 0.06 * s, 0.26 * s, 0.26 * s, 0.26 * s, 0.16 * s, { top: "#b3bdcb", left: "#8f99a8", right: "#788290" });
  }
  function vFlower(gx, gy, col) {
    const p = vp(gx, gy, 0.06);
    return '<circle cx="' + (p[0] - 4) + '" cy="' + (p[1] - 1) + '" r="1.9" fill="' + col + '"/>' +
      '<circle cx="' + (p[0] + 4) + '" cy="' + (p[1] + 1) + '" r="1.6" fill="' + col + '" opacity="0.9"/>' +
      '<circle cx="' + p[0] + '" cy="' + (p[1] - 3) + '" r="1.4" fill="#fff6a8" opacity="0.85"/>';
  }
  function vLamp(gx, gy) {
    const p = vp(gx, gy, 1.62);
    return vbox(gx - 0.06, gy - 0.06, 0, 0.12, 0.12, 1.55, { top: "#93a7c9", left: "#7386a6", right: "#5c6c88" }) +
      '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="20" fill="#ffbe0b" opacity="0.18" filter="url(#vBlurSm)"/>' +
      '<circle class="lampBulb" cx="' + p[0] + '" cy="' + p[1] + '" r="5.4" fill="#ffe9a8" opacity="0.25" stroke="#ffbe0b" stroke-width="1.1"/>';
  }

  /* ---------- 상점 (시장 노점) ---------- */
  function vShop(gx, gy) {
    const wood = { top: "#b98147", left: "#9c6a39", right: "#7f542c" };
    const woodD = { top: "#8f6234", left: "#7a5129", right: "#654021" };
    const cream = { top: "#f4e9d4", left: "#e4d7bd", right: "#cfc0a0" };
    let s = "";
    s += vbox(gx - 0.05, gy - 0.05, 0, 2.3, 2.1, 0.18, woodD);           // 데크
    s += vbox(gx, gy + 0.03, 0.18, 2.2, 0.14, 1.15, cream);              // 뒷벽
    s += vbox(gx, gy, 0.18, 0.14, 0.14, 1.48, wood);
    s += vbox(gx + 2.06, gy, 0.18, 0.14, 0.14, 1.48, wood);
    s += vbox(gx, gy + 1.9, 0.18, 0.14, 0.14, 1.24, wood);
    s += vbox(gx + 2.06, gy + 1.9, 0.18, 0.14, 0.14, 1.24, wood);
    // 줄무늬 차양
    const zBack = 1.66, zFront = 1.3, seg = 2.2 / 6;
    for (let i = 0; i < 6; i++) {
      const c = i % 2 === 0 ? "#e63946" : "#f7f3e9";
      s += vpoly([vp(gx + i * seg, gy - 0.06, zBack), vp(gx + (i + 1) * seg, gy - 0.06, zBack),
        vp(gx + (i + 1) * seg, gy + 2.13, zFront), vp(gx + i * seg, gy + 2.13, zFront)], c, ' stroke="#00000012" stroke-width="0.7"');
      s += vpoly([vp(gx + i * seg, gy + 2.13, zFront), vp(gx + (i + 1) * seg, gy + 2.13, zFront),
        vp(gx + (i + 1) * seg, gy + 2.13, zFront - 0.16), vp(gx + i * seg, gy + 2.13, zFront - 0.16)], c, ' opacity="0.92"');
    }
    // 카운터
    s += vbox(gx + 0.14, gy + 1.22, 0.18, 1.9, 0.52, 0.44, wood);
    s += vpoly([vp(gx + 0.14, gy + 1.22, 0.62), vp(gx + 2.04, gy + 1.22, 0.62), vp(gx + 2.04, gy + 1.74, 0.62), vp(gx + 0.14, gy + 1.74, 0.62)], "#d99a55");
    // 상자 · 통
    s += vbox(gx + 0.16, gy + 0.28, 0.18, 0.42, 0.42, 0.36, { top: "#c8a05e", left: "#ab8547", right: "#8d6b37" });
    s += vbox(gx + 0.62, gy + 0.3, 0.18, 0.36, 0.36, 0.28, { top: "#c8a05e", left: "#ab8547", right: "#8d6b37" });
    s += vbox(gx + 1.55, gy + 0.34, 0.18, 0.4, 0.4, 0.44, { top: "#a8753f", left: "#8d5f31", right: "#734c25" });
    // 카운터 위 물약
    s += vbox(gx + 0.34, gy + 1.36, 0.62, 0.11, 0.11, 0.2, { top: "#7be0ff", left: "#38b6ff", right: "#1f8fd6" });
    s += vbox(gx + 0.62, gy + 1.36, 0.62, 0.11, 0.11, 0.2, { top: "#ff9db5", left: "#ff5c86", right: "#d63c66" });
    s += vbox(gx + 0.9, gy + 1.36, 0.62, 0.11, 0.11, 0.2, { top: "#b6f28a", left: "#7ed957", right: "#5fa93c" });
    // 현수막 표지판
    s += vbox(gx + 0.62, gy + 2.0, 1.06, 0.96, 0.08, 0.34, { top: "#ffd166", left: "#e0a72f", right: "#c08c1e" });
    return s;
  }

  /* ---------- 대장간 ---------- */
  function vForge(gx, gy) {
    const stone = { top: "#818b99", left: "#6a727f", right: "#565d69" };
    const stoneD = { top: "#5f6874", left: "#4f5763", right: "#414852" };
    const slate = { top: "#414754", left: "#363c47", right: "#2c313b" };
    let s = "";
    s += vbox(gx, gy, 0, 2.1, 1.7, 1.02, stone);
    s += vbox(gx - 0.12, gy - 0.12, 1.02, 2.34, 1.94, 0.16, slate);
    s += vbox(gx + 1.46, gy + 0.22, 1.18, 0.4, 0.4, 0.86, stoneD);
    // 화로 입구
    s += vpoly([vp(gx + 0.62, gy + 1.7, 0.66), vp(gx + 1.4, gy + 1.7, 0.66), vp(gx + 1.4, gy + 1.7, 0.06), vp(gx + 0.62, gy + 1.7, 0.06)], "#22140d");
    const fm = vp(gx + 1.01, gy + 1.7, 0.36);
    s += '<ellipse class="v-fire" cx="' + fm[0] + '" cy="' + fm[1] + '" rx="14" ry="7" fill="#ff8a1f" opacity="0.85"/>' +
      '<ellipse class="v-fire2" cx="' + fm[0] + '" cy="' + fm[1] + '" rx="7" ry="4" fill="#ffe08a" opacity="0.9"/>';
    // 굴뚝 연기
    const ch = vp(gx + 1.66, gy + 0.42, 2.1);
    s += '<circle class="smoke-particle" cx="' + ch[0] + '" cy="' + ch[1] + '" r="4.2" fill="#c9d4e6" opacity="0.5"/>' +
      '<circle class="smoke-particle smoke-2" cx="' + (ch[0] + 2) + '" cy="' + (ch[1] - 2) + '" r="3.4" fill="#c9d4e6" opacity="0.4"/>';
    // 모루와 망치
    s += vbox(gx + 1.42, gy + 2.02, 0, 0.26, 0.24, 0.2, { top: "#4b525f", left: "#3c424d", right: "#31363f" });
    s += vbox(gx + 1.34, gy + 1.96, 0.2, 0.44, 0.36, 0.13, { top: "#5b6371", left: "#49505c", right: "#3b414b" });
    // 불티
    const sp = vp(gx + 0.8, gy + 1.95, 1.0);
    s += '<circle class="v-spark" cx="' + sp[0] + '" cy="' + sp[1] + '" r="1.7" fill="#ffd166"/>' +
      '<circle class="v-spark2" cx="' + (sp[0] + 9) + '" cy="' + (sp[1] + 6) + '" r="1.4" fill="#ff8a1f"/>';
    return s;
  }

  /* ---------- 포탈 ---------- */
  function vPortal(gx, gy) {
    const cx = gx + 1.1, cy = gy + 1.1;
    const base = vp(cx, cy, 0.46);
    const ringW = 30, ringH = 38;
    const rcx = base[0], rcy = base[1] - 6 - ringH;
    let s = "";
    // 뒤 광휘
    s += '<ellipse cx="' + rcx + '" cy="' + rcy + '" rx="' + (ringW + 40) + '" ry="' + (ringH + 34) + '" fill="url(#vPortalGlow)" filter="url(#vBlur)"/>';
    // 기단
    s += vbox(gx, gy, 0, 2.2, 2.2, 0.28, { top: "#6a7182", left: "#565d6c", right: "#474d5a" });
    s += vbox(gx + 0.2, gy + 0.2, 0.28, 1.8, 1.8, 0.18, { top: "#7d859a", left: "#666e80", right: "#545a6b" });
    // 링
    s += '<ellipse cx="' + rcx + '" cy="' + rcy + '" rx="' + ringW + '" ry="' + ringH + '" fill="none" stroke="#6e7789" stroke-width="9"/>';
    s += '<ellipse cx="' + rcx + '" cy="' + rcy + '" rx="' + ringW + '" ry="' + ringH + '" fill="none" stroke="#a9b4c8" stroke-width="2.4" opacity="0.75"/>';
    s += '<ellipse cx="' + rcx + '" cy="' + rcy + '" rx="' + (ringW - 4.5) + '" ry="' + (ringH - 4.5) + '" fill="url(#vPortal)"/>';
    // 소용돌이
    s += '<g><animateTransform attributeName="transform" type="rotate" from="0 ' + rcx + ' ' + rcy + '" to="360 ' + rcx + ' ' + rcy + '" dur="10s" repeatCount="indefinite"/>';
    for (let i = 0; i < 3; i++) {
      const k = 0.34 + i * 0.2;
      s += '<ellipse cx="' + rcx + '" cy="' + rcy + '" rx="' + ((ringW - 8) * k).toFixed(1) + '" ry="' + ((ringH - 8) * k).toFixed(1) +
        '" fill="none" stroke="#d6fffa" stroke-width="1.6" opacity="0.6" stroke-dasharray="' + (7 + i * 4) + " " + (5 + i * 3) + '"/>';
    }
    s += "</g>";
    // 회전하는 룬
    s += '<g><animateTransform attributeName="transform" type="rotate" from="360 ' + rcx + ' ' + rcy + '" to="0 ' + rcx + ' ' + rcy + '" dur="16s" repeatCount="indefinite"/>';
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI * 2 * i) / 6;
      const rx2 = (ringW + 9) * Math.cos(a), ry2 = (ringH + 9) * Math.sin(a);
      s += '<circle cx="' + (rcx + rx2).toFixed(1) + '" cy="' + (rcy + ry2).toFixed(1) + '" r="2.6" fill="#9cf6ea" opacity="0.85"/>';
    }
    s += "</g>";
    // 기단 위 빛무리
    s += '<ellipse class="lampBulb" cx="' + base[0] + '" cy="' + (base[1] + 2) + '" rx="' + (ringW + 16) + '" ry="9" fill="#00f5d4" opacity="0.25"/>';
    return { svg: s, anchor: [rcx, rcy - ringH - 16] };
  }

  /* ---------- 마을 (집 여러 채 + 광장) ---------- */
  function vTown(gx, gy) {
    const wallA = { top: "#e8dcc4", left: "#d5c8ac", right: "#c0b294" };
    const wallB = { top: "#dcd2e8", left: "#c9bfd8", right: "#b3a9c4" };
    const wallC = { top: "#e6d6c2", left: "#d2c0aa", right: "#bda992" };
    const roof = { light: "#ffc94a", mid: "#f0a92b", dark: "#c98a1e" };
    const roof2 = { light: "#ff9d6b", mid: "#ef7f4b", dark: "#c96433" };
    let s = "";
    // 뒤쪽 집
    s += vHouse(7.05, 2.45, 1.05, 0.85, 0.78, 0.52, wallA, roof);
    s += vWindows(7.05, 2.45, 1.05, 0.85, 0.78);
    // 오른쪽 큰 집
    s += vHouse(8.28, 2.58, 1.0, 0.8, 0.92, 0.58, wallB, roof);
    s += vWindows(8.28, 2.58, 1.0, 0.8, 0.92);
    // 앞쪽 집
    s += vHouse(7.55, 3.5, 0.95, 0.75, 0.66, 0.48, wallC, roof2);
    s += vWindows(7.55, 3.5, 0.95, 0.75, 0.66);
    // 깃대
    s += vbox(8.62, 3.18, 0, 0.09, 0.09, 1.75, { top: "#cfd6e2", left: "#a9b1c0", right: "#8d94a3" });
    const fp = vp(8.71, 3.22, 1.72);
    s += '<path class="v-flag" d="M' + fp[0] + ',' + fp[1] + ' l17,5 l-17,6 z" fill="#7ed957" opacity="0.95"/>';
    // 광장 우물
    s += vbox(7.02, 3.62, 0, 0.5, 0.5, 0.26, { top: "#8b93a3", left: "#767e8d", right: "#626a78" });
    s += vpoly([vp(7.08, 3.68, 0.27), vp(7.46, 3.68, 0.27), vp(7.46, 4.06, 0.27), vp(7.08, 4.06, 0.27)], "#3fa9e0");
    return s;
  }

  function vHouse(gx, gy, w, d, wh, rh, wall, roof) {
    let s = vbox(gx, gy, 0, w, d, wh, wall);
    const apex = vp(gx + w / 2, gy + d / 2, wh + rh);
    const p1 = vp(gx, gy, wh), p2 = vp(gx + w, gy, wh), p3 = vp(gx + w, gy + d, wh), p4 = vp(gx, gy + d, wh);
    s += vpoly([p1, p2, apex], roof.dark);
    s += vpoly([p4, p1, apex], roof.dark);
    s += vpoly([p2, p3, apex], roof.mid);
    s += vpoly([p3, p4, apex], roof.light);
    return s;
  }
  function vWindows(gx, gy, w, d, wh) {
    let s = "";
    s += vpoly([vp(gx + w * 0.2, gy + d, wh * 0.74), vp(gx + w * 0.44, gy + d, wh * 0.74),
      vp(gx + w * 0.44, gy + d, wh * 0.32), vp(gx + w * 0.2, gy + d, wh * 0.32)], "#ffd76a", ' class="windowLight" opacity="0.1"');
    s += vpoly([vp(gx + w, gy + d * 0.18, wh * 0.74), vp(gx + w, gy + d * 0.44, wh * 0.74),
      vp(gx + w, gy + d * 0.44, wh * 0.32), vp(gx + w, gy + d * 0.18, wh * 0.32)], "#ffd76a", ' class="windowLight" opacity="0.1"');
    s += vpoly([vp(gx + w * 0.58, gy + d, wh * 0.82), vp(gx + w * 0.84, gy + d, wh * 0.82),
      vp(gx + w * 0.84, gy + d, 0), vp(gx + w * 0.58, gy + d, 0)], "#5a3a22");
    return s;
  }

  function vBuildingGroup(kind, label, inner, padPt) {
    return '<g class="v-building" data-kind="' + kind + '" role="button" tabindex="0" aria-label="' + label + ' 열기">' +
      '<g class="v-building-body">' +
      '<ellipse class="v-pad" cx="' + padPt[0] + '" cy="' + padPt[1] + '" rx="74" ry="30" fill="#00f5d4" opacity="0.16" filter="url(#vBlurSm)"/>' +
      inner + "</g></g>";
  }

  /* ---------- 마을 전체 SVG ---------- */
  function buildVillageSvg() {
    const pathSet = new Set();
    for (let x = 0; x < V_N; x++) {
      for (let y = 0; y < V_N; y++) {
        if (Math.abs((x + 0.5) - V_C) <= 1.0 || Math.abs((y + 0.5) - V_C) <= 1.0) pathSet.add(x + "," + y);
      }
    }
    V_SITES.forEach(s => {
      for (let x = Math.floor(s.gx - 0.7); x <= Math.ceil(s.gx + s.w + 0.6); x++)
        for (let y = Math.floor(s.gy - 0.7); y <= Math.ceil(s.gy + s.d + 0.6); y++) pathSet.add(x + "," + y);
    });
    const nearSite = (x, y) => V_SITES.some(s => x + 0.5 > s.gx - 1.0 && x + 0.5 < s.gx + s.w + 1.0 && y + 0.5 > s.gy - 1.0 && y + 0.5 < s.gy + s.d + 1.0);

    const GRASS = ["#8fd35f", "#7fc64f", "#9adc6b", "#86cc57"];
    const PATH = ["#d6bd92", "#cdb083", "#e0c99e"];
    const DIRT_L = ["#8a6440", "#7a5736", "#6b4a2d", "#5c3f26"];
    const DIRT_R = ["#77532f", "#684728", "#5b3d22", "#4e331b"];

    const cells = [];
    for (let x = 0; x < V_N; x++) for (let y = 0; y < V_N; y++) if (vInside(x + 0.5, y + 0.5)) cells.push([x, y]);
    cells.sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]) || a[0] - b[0]);

    let terrain = "";
    const decos = [];
    cells.forEach(([x, y]) => {
      const isPath = pathSet.has(x + "," + y);
      const topC = isPath ? PATH[Math.floor(vhash(x, y, 5) * 3)] : GRASS[Math.floor(vhash(x, y, 4) * 4)];
      const depth = 4 + (vhash(x, y, 9) > 0.5 ? 1 : 0);
      for (let k = 0; k < depth; k++) {
        const zt = -k, zb = -k - 1;
        const lc = k === 0 ? (isPath ? "#b99668" : "#6da340") : DIRT_L[Math.min(3, k - 1)];
        const rc = k === 0 ? (isPath ? "#a9875b" : "#5c9038") : DIRT_R[Math.min(3, k - 1)];
        terrain += vpoly([vp(x, y + 1, zt), vp(x + 1, y + 1, zt), vp(x + 1, y + 1, zb), vp(x, y + 1, zb)], lc);
        terrain += vpoly([vp(x + 1, y, zt), vp(x + 1, y + 1, zt), vp(x + 1, y + 1, zb), vp(x + 1, y, zb)], rc);
      }
      terrain += vpoly([vp(x, y, 0), vp(x + 1, y, 0), vp(x + 1, y + 1, 0), vp(x, y + 1, 0)], topC,
        ' stroke="' + (isPath ? "#b2925f" : "#71a844") + '" stroke-width="0.7" stroke-opacity="0.55"');

      if (!isPath && !nearSite(x, y)) {
        const r = vhash(x, y, 21);
        const cx2 = x + 0.5, cy2 = y + 0.5;
        if (r < 0.17) decos.push({ d: x + y, s: vTree(cx2, cy2, 0.85 + vhash(x, y, 31) * 0.4) });
        else if (r < 0.26) decos.push({ d: x + y, s: vFlower(cx2 + 0.1, cy2 - 0.1, vhash(x, y, 41) > 0.5 ? "#ff7aa2" : "#ffe066") });
        else if (r < 0.3) decos.push({ d: x + y, s: vRock(cx2, cy2, 0.9) });
      }
    });
    decos.sort((a, b) => a.d - b.d);
    const decoStr = decos.map(o => o.s).join("");

    // 별
    let stars = "";
    for (let i = 0; i < 54; i++) {
      const sx = Math.round(vhash(i, 1, 3) * V_W);
      const sy = Math.round(vhash(i, 2, 3) * (V_H * 0.62));
      const r = (0.8 + vhash(i, 3, 3) * 1.7).toFixed(1);
      const cls = i % 3 === 1 ? " star-2" : i % 3 === 2 ? " star-3" : "";
      stars += '<circle class="star-twinkle' + cls + '" cx="' + sx + '" cy="' + sy + '" r="' + r +
        '" fill="#ffffff" opacity="' + (0.3 + vhash(i, 4, 3) * 0.5).toFixed(2) + '"/>';
    }

    const shopSite = V_SITES[0], forgeSite = V_SITES[2], townSite = V_SITES[3];
    const shopPad = vp(shopSite.gx + shopSite.w / 2, shopSite.gy + shopSite.d / 2, 0.05);
    const forgePad = vp(forgeSite.gx + forgeSite.w / 2, forgeSite.gy + forgeSite.d / 2, 0.05);
    const townPad = vp(townSite.gx + townSite.w / 2, townSite.gy + townSite.d / 2, 0.05);
    const portalSite = V_SITES[1];
    const portalPad = vp(portalSite.gx + portalSite.w / 2, portalSite.gy + portalSite.d / 2, 0.05);

    const portal = vPortal(portalSite.gx, portalSite.gy);

    // 건물 배치 (뒤 -> 앞)
    const buildList = [
      { d: shopSite.gx + shopSite.gy, s: vBuildingGroup("shop", "상점", vShop(shopSite.gx, shopSite.gy), shopPad) },
      { d: portalSite.gx + portalSite.gy, s: vBuildingGroup("portal", "포탈", portal.svg, portalPad) },
      { d: forgeSite.gx + forgeSite.gy, s: vBuildingGroup("forge", "대장간", vForge(forgeSite.gx, forgeSite.gy), forgePad) },
      { d: townSite.gx + townSite.gy, s: vBuildingGroup("town", "마을", vTown(townSite.gx, townSite.gy), townPad) }
    ].sort((a, b) => a.d - b.d).map(o => o.s).join("");

    const svg = '<svg class="villageArt tod-day" viewBox="0 0 ' + V_W + " " + V_H + '" xmlns="http://www.w3.org/2000/svg" ' +
      'role="img" aria-label="코덱스 3D 아이소메트릭 마을" preserveAspectRatio="xMidYMid meet">' +
      '<defs>' +
      '<linearGradient id="vSky" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#0a1230"/><stop offset="45%" stop-color="#152246"/><stop offset="100%" stop-color="#070a18"/>' +
      "</linearGradient>" +
      '<radialGradient id="vVoid" cx="50%" cy="60%" r="55%">' +
      '<stop offset="0%" stop-color="#2f6bff" stop-opacity="0.5"/><stop offset="55%" stop-color="#7b2cbf" stop-opacity="0.18"/>' +
      '<stop offset="100%" stop-color="#000000" stop-opacity="0"/></radialGradient>' +
      '<radialGradient id="vPortal" cx="50%" cy="50%" r="50%">' +
      '<stop offset="0%" stop-color="#eafffb" stop-opacity="0.95"/><stop offset="35%" stop-color="#00f5d4" stop-opacity="0.85"/>' +
      '<stop offset="70%" stop-color="#7b2cbf" stop-opacity="0.8"/><stop offset="100%" stop-color="#12062a" stop-opacity="0.92"/></radialGradient>' +
      '<radialGradient id="vPortalGlow" cx="50%" cy="50%" r="50%">' +
      '<stop offset="0%" stop-color="#00f5d4" stop-opacity="0.55"/><stop offset="60%" stop-color="#7b2cbf" stop-opacity="0.22"/>' +
      '<stop offset="100%" stop-color="#000000" stop-opacity="0"/></radialGradient>' +
      '<filter id="vBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>' +
      '<filter id="vBlurSm" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>' +
      "</defs>" +
      '<rect width="' + V_W + '" height="' + V_H + '" fill="url(#vSky)"/>' +
      '<ellipse cx="' + (V_W / 2) + '" cy="' + (V_H * 0.68) + '" rx="' + (V_W * 0.52) + '" ry="' + (V_H * 0.46) + '" fill="url(#vVoid)"/>' +
      "<g>" + stars + "</g>" +
      '<circle id="skyGlow" cx="600" cy="58" r="42" fill="#ffbe0b" opacity="0.45" filter="url(#vBlur)"/>' +
      '<circle id="skyBody" cx="600" cy="58" r="20" fill="#fff6cf"/>' +
      '<ellipse cx="' + (V_W / 2) + '" cy="' + (V_H - 40) + '" rx="250" ry="26" fill="#000000" opacity="0.35" filter="url(#vBlur)"/>' +
      "<g>" + terrain + decoStr +
      vLamp(3.9, 6.6) + vLamp(6.9, 3.85) + vLamp(6.6, 7.2) +
      "</g>" + buildList +
      '<rect class="v-tint v-tint-morning" width="' + V_W + '" height="' + V_H + '" fill="#ff9d5c" fill-opacity="0.14"/>' +
      '<rect class="v-tint v-tint-day" width="' + V_W + '" height="' + V_H + '" fill="#ffe9a8" fill-opacity="0.05"/>' +
      '<rect class="v-tint v-tint-afternoon" width="' + V_W + '" height="' + V_H + '" fill="#ffb168" fill-opacity="0.1"/>' +
      '<rect class="v-tint v-tint-evening" width="' + V_W + '" height="' + V_H + '" fill="#ff6b3d" fill-opacity="0.2"/>' +
      '<rect class="v-tint v-tint-night" width="' + V_W + '" height="' + V_H + '" fill="#0b1a45" fill-opacity="0.52"/>' +
      "</svg>";

    const anchors = {
      shop: vp(shopSite.gx + shopSite.w / 2, shopSite.gy + shopSite.d / 2, 2.15),
      portal: portal.anchor,
      forge: vp(forgeSite.gx + forgeSite.w / 2, forgeSite.gy + forgeSite.d / 2, 2.05),
      town: vp(townSite.gx + townSite.w / 2, townSite.gy + townSite.d / 2, 2.15)
    };
    return { svg: svg, anchors: anchors };
  }

  /* ---------- 마을 조립 & 라벨 ---------- */
  function buildVillage() {
    const stage = document.getElementById("villageStage");
    if (!stage || stage.querySelector(".villageArt")) return;
    const built = buildVillageSvg();
    stage.insertAdjacentHTML("afterbegin", built.svg);
    const svg = stage.querySelector(".villageArt");
    attachVillageHits(svg);
    buildVillageLabels(built.anchors);
    const loading = document.getElementById("villageLoading");
    if (loading) loading.remove();
  }

  function attachVillageHits(svg) {
    if (!svg) return;
    const names = { shop: "상점", forge: "대장간", portal: "포탈", town: "마을" };
    svg.querySelectorAll(".v-building").forEach(g => {
      const kind = g.getAttribute("data-kind");
      g.addEventListener("click", e => {
        e.stopPropagation();
        window.villageTap(kind);
      });
      g.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          window.villageTap(kind);
        }
      });
      let bb = null;
      try { bb = g.getBBox(); } catch (err) { bb = null; }
      if (!bb || !bb.width) return;
      const pad = 6;
      const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      r.setAttribute("x", (bb.x - pad).toFixed(1));
      r.setAttribute("y", (bb.y - pad).toFixed(1));
      r.setAttribute("width", (bb.width + pad * 2).toFixed(1));
      r.setAttribute("height", (bb.height + pad * 2).toFixed(1));
      r.setAttribute("class", "v-hit");
      r.setAttribute("aria-hidden", "true");
      g.insertBefore(r, g.firstChild);
    });
  }

  function buildVillageLabels(anchors) {
    const box = document.getElementById("villageLabels");
    if (!box || !anchors) return;
    const defs = [
      { key: "shop", icon: "🛒", name: "상점" },
      { key: "forge", icon: "⚒️", name: "대장간" },
      { key: "portal", icon: "🌀", name: "포탈" },
      { key: "town", icon: "🏘️", name: "마을" }
    ];
    box.innerHTML = "";
    defs.forEach(d => {
      const a = anchors[d.key];
      if (!a) return;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "village-label " + d.key;
      btn.innerHTML = '<span class="lb-ico">' + d.icon + '</span><span>' + d.name + '</span>';
      btn.style.left = (a[0] / V_W * 100).toFixed(2) + "%";
      btn.style.top = (a[1] / V_H * 100).toFixed(2) + "%";
      btn.setAttribute("aria-label", d.name + " 열기");
      btn.addEventListener("click", e => {
        e.preventDefault();
        e.stopPropagation();
        window.villageTap(d.key);
      });
      box.appendChild(btn);
    });
  }

  /* ---------- 마을 조작 ---------- */
  window.villageTap = function (kind) {
    if (!getCurrentUser()) {
      openAuthModal();
      return;
    }
    Sound.click();
    if (kind === "shop") window.openShopView("sell");
    else if (kind === "forge") window.openShopView("forge");
    else if (kind === "portal") { closeVillageView(); show("map"); }
    else window.openVillageView();
  };

  function setShopView(view) {
    const forge = document.getElementById("forgeSection");
    const sell = document.getElementById("sellSection");
    if (!forge || !sell) return;
    sell.style.display = (view === "sell" || view === "all") ? "" : "none";
    forge.style.display = (view === "forge" || view === "all") ? "" : "none";
    document.querySelectorAll(".shop-view-tab").forEach(b => {
      b.classList.toggle("active", b.getAttribute("data-view") === view);
    });
  }
  window.setShopView = setShopView;

  window.openShopView = function (view) {
    show("shop");
    const target = document.getElementById("shop");
    if (!target || !target.classList.contains("active")) return;
    setShopView(view === "forge" ? "forge" : "sell");
    const section = document.getElementById(view === "forge" ? "forgeSection" : "sellSection");
    if (!section) return;
    setTimeout(() => {
      try { section.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) { }
      section.classList.remove("shop-flash");
      void section.offsetWidth;
      section.classList.add("shop-flash");
      setTimeout(() => section.classList.remove("shop-flash"), 1300);
    }, 140);
  };

  window.openVillageView = function () {
    const ov = document.getElementById("villageViewOverlay");
    if (!ov) return;
    const job = getCurrentJob();
    const upg = getJobUpgrade(job.id);
    const st = getPlayerStats();
    const period = getTodPeriod(new Date().getHours());
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    set("vmLevel", "Lv." + state.level);
    set("vmTokens", "🪙 " + state.tokens);
    set("vmJob", job.icon + " " + getJobFullTitle(job, upg));
    set("vmAtkDef", "⚔️ " + st.atk + " / 🛡️ " + st.def);
    set("vmRecord", state.lastEvent || "모험을 시작해보세요.");
    const tod = document.getElementById("vmTod");
    if (tod) {
      tod.textContent = TOD_CONFIG[period].badge;
      tod.className = "vm-tod vm-tod-" + period;
    }
    ov.style.display = "flex";
  };
  window.closeVillageView = function () {
    const ov = document.getElementById("villageViewOverlay");
    if (ov) ov.style.display = "none";
  };
  window.villageViewBackdrop = function (e) {
    if (e.target && e.target.id === "villageViewOverlay") window.closeVillageView();
  };

  document.addEventListener("DOMContentLoaded", () => {
    initBgParticles();
    buildVillage();
    updateVillageDayNight();
    setInterval(updateVillageDayNight, 60 * 1000);
    updateAuthUI();
    updateUI();
  });

  // 브라우저 오디오 권한 자동 활성화 리스너
  ['click', 'keydown', 'touchstart', 'submit'].forEach(evt => {
    window.addEventListener(evt, () => {
      initAudio();
    }, { passive: true });
  });

  // 코드 열람 및 개발자 도구 단축키 방어
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    if (e.key === "F12" || 
        (e.ctrlKey && e.shiftKey && ["I","J","C","i","j","c"].includes(e.key)) || 
        (e.ctrlKey && ["u","U","s","S"].includes(e.key))) {
      e.preventDefault();
      return false;
    }
  });

  window.addEventListener("error", e => console.warn("[CODEX Guard]", e.error || e.message));
})();

}catch(e){document.getElementById("out").textContent="CAUGHT: "+e.message+"\n"+(e.stack||"");}
</script></body></html>
